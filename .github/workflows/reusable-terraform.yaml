name: Reusable Terraform Workflow (Enterprise)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "us-east-1"
    secrets:
      AWS_ROLE_ARN:
        required: true

jobs:
  terraform:
    name: "Terraform ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: "Stage 1: Checkout"
        uses: actions/checkout@11bd71901dde5b5ca6a1a90b9738e10b01e3470a # v4.2.2

      - name: "Stage 2: Configure AWS OIDC"
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: "Stage 3: Setup Terraform"
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: "Stage 4: Terraform Init"
        working-directory: ${{ inputs.working_directory }}
        run: terraform init

      - name: "Stage 5: Terraform Format & Validate"
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: "Stage 6: TFLint"
        working-directory: ${{ inputs.working_directory }}
        run: |
          curl -sL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init && tflint --recursive

      - name: "Stage 7: Checkov Security Scan"
        working-directory: ${{ inputs.working_directory }}
        run: |
          pip install checkov --quiet
          checkov -d . --framework terraform --compact || true

      - name: "Stage 8: Terraform Plan"
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -out=tfplan

      - name: "Stage 9: Upload Plan Artifact"
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 90

      - name: "Stage 10: Infracost Cost Estimation"
        uses: infracost/actions/setup@8e3b31244f9d2c1d5e9e8a1f2c3b4d5e6f7a8b9c # v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || '' }}
