name: Terraform + Ansible CI/CD Pipeline (Stage-by-Stage)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # Enables future OIDC (recommended over long-lived keys)

env:
  AWS_DEFAULT_REGION: us-east-1
  TERRAFORM_VERSION: "1.9.8"
  ANSIBLE_VERSION: "10.3.0"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: TERRAFORM (Infrastructure Provisioning)
  # ═══════════════════════════════════════════════════════════════
  terraform:
    name: "1. Terraform - Provision Infrastructure"
    runs-on: ubuntu-latest

    outputs:
      master_ip: ${{ steps.outputs.outputs.master_ip }}
      worker_ips: ${{ steps.outputs.outputs.worker_ips }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # STAGE 1: Checkout & Environment Setup
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 1.1: Checkout repository"
        uses: actions/checkout@v7

      - name: "Stage 1.2: Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          # For OIDC (recommended): uncomment below and remove access keys
          # role-to-assume: arn:aws:iam::ACCOUNT:role/GitHubActionsRole
          # audience: sts.amazonaws.com

      - name: "Stage 1.3: Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "Stage 1.4: Install security scanners"
        run: |
          curl -sL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          pip install checkov --quiet

      # ─────────────────────────────────────────────────────────────
      # STAGE 2: Validation & Security Scanning
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 2.1: Terraform Format Check"
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: "Stage 2.2: Terraform Init"
        working-directory: terraform
        run: terraform init -backend=false

      - name: "Stage 2.3: Terraform Validate"
        working-directory: terraform
        run: terraform validate

      - name: "Stage 2.4: TFLint Security Scan"
        working-directory: terraform
        run: tflint --init && tflint --recursive

      - name: "Stage 2.5: Checkov IaC Security Scan"
        working-directory: terraform
        run: checkov -d . --framework terraform --compact

      # ─────────────────────────────────────────────────────────────
      # STAGE 3: Plan & Artifact Upload
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 3.1: Terraform Plan"
        working-directory: terraform
        run: terraform plan -out=tfplan -detailed-exitcode || true

      - name: "Stage 3.2: Upload Terraform Plan Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # STAGE 4: Apply (Production Gate)
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 4.1: Terraform Apply"
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: "Stage 4.2: Extract Outputs"
        id: outputs
        working-directory: terraform
        run: |
          MASTER_IP=$(terraform output -raw ansible_master_public_ip)
          WORKER_IPS=$(terraform output -json worker_public_ips | jq -c '.')

          echo "master_ip=$MASTER_IP" >> $GITHUB_OUTPUT
          echo "worker_ips=$WORKER_IPS" >> $GITHUB_OUTPUT

          echo "::add-mask::$MASTER_IP"
          echo "Terraform outputs extracted successfully."

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: ANSIBLE (Configuration Management)
  # ═══════════════════════════════════════════════════════════════
  ansible:
    name: "2. Ansible - Configure Servers"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      # ─────────────────────────────────────────────────────────────
      # STAGE 1: Environment Preparation
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 1.1: Checkout repository"
        uses: actions/checkout@v7

      - name: "Stage 1.2: Install Ansible"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible jq openssh-client
          pip install ansible-core==${{ env.ANSIBLE_VERSION }} --quiet

      - name: "Stage 1.3: Configure SSH Key"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/devops-key.pem
          chmod 600 ~/.ssh/devops-key.pem

          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/devops-key.pem
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      # ─────────────────────────────────────────────────────────────
      # STAGE 2: Dynamic Inventory Generation
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 2.1: Build Ansible Inventory"
        run: |
          MASTER_IP="${{ needs.terraform.outputs.master_ip }}"
          WORKER_IPS='${{ needs.terraform.outputs.worker_ips }}'

          mkdir -p ansible

          cat > ansible/inventory.ini <<EOF
          [master]
          $MASTER_IP ansible_user=ubuntu

          [workers]
          EOF

          echo "$WORKER_IPS" | jq -r '.[]' | while read IP; do
            [[ -n "$IP" ]] && echo "$IP ansible_user=ubuntu"
          done >> ansible/inventory.ini

          cat >> ansible/inventory.ini <<EOF

          [webservers:children]
          master
          workers

          [all:vars]
          ansible_ssh_private_key_file=~/.ssh/devops-key.pem
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          echo "Inventory created:"
          cat ansible/inventory.ini

      # ─────────────────────────────────────────────────────────────
      # STAGE 3: Connectivity & Validation
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 3.1: Ansible Ping Test"
        working-directory: ansible
        run: ansible all -i inventory.ini -m ping

      - name: "Stage 3.2: Show Inventory Graph"
        working-directory: ansible
        run: ansible-inventory -i inventory.ini --graph

      # ─────────────────────────────────────────────────────────────
      # STAGE 4: Apply Configuration
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 4.1: Run Ansible Playbook"
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventory.ini \
            playbook.yml \
            --diff -v

      # ─────────────────────────────────────────────────────────────
      # STAGE 5: Post-Deployment Verification
      # ─────────────────────────────────────────────────────────────
      - name: "Stage 5.1: Nginx Smoke Test"
        run: |
          MASTER_IP="${{ needs.terraform.outputs.master_ip }}"

          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$MASTER_IP" || true)
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ SUCCESS: Nginx returned HTTP 200"
              exit 0
            fi
            echo "Attempt $i/5 - HTTP $HTTP_CODE"
            sleep 10
          done
          echo "❌ ERROR: Smoke test failed"
          exit 1
