---
- name: Install and configure Nginx
  hosts: webservers
  become: true
  tasks:
    - name: Install Nginx
      package:
        name: nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Allow HTTP in firewall
      ufw:
        rule: allow
        port: "80"
        proto: tcp
      ignore_errors: true
